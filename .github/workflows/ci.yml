name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: habitacores_integration_test
          POSTGRES_PASSWORD: habitacores_test
          POSTGRES_USER: habitacores_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habitacores_test -d habitacores_integration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install approved pnpm version
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify toolchain
        run: |
          node --version
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository policy
        run: pnpm repository:policy

      - name: Validate workspace boundaries
        run: pnpm workspace:boundaries

      - name: Validate database migration history
        run: pnpm db:check

      - name: Validate row-level security migration
        run: pnpm db:rls:check

      - name: Check formatting
        run: pnpm format:check

      - name: Run lint checks
        run: pnpm lint

      - name: Run type checks
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run isolated PostgreSQL integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://habitacores_test:habitacores_test@127.0.0.1:5432/habitacores_integration_test

      - name: Run PostgreSQL row-level security tests
        run: pnpm test:rls
        env:
          TEST_DATABASE_URL: postgresql://habitacores_test:habitacores_test@127.0.0.1:5432/habitacores_integration_test

      - name: Build workspaces
        run: pnpm build
